<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Warga — Lapor Pak RT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              coral: '#FF6B57',
              'coral-hover': '#E05643',
              'coral-light': '#FFF0ED',
              teal: '#4EBA9F',
              'teal-dark': '#3DA087',
              'teal-light': '#EBF8F5',
              amber: '#FBBF24',
              'amber-dark': '#B45309',
              'amber-light': '#FEF9C3',
              slate: '#1E293B',
              muted: '#64748B',
              canvas: '#D5DDE5'
            }
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          boxShadow: {
            'glow-coral': '0 8px 24px -4px rgba(255, 107, 87, 0.35)',
            'glow-teal': '0 8px 24px -4px rgba(78, 186, 159, 0.35)',
            'tactile': '0 12px 36px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04)'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    @view-transition { navigation: auto; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    #app:not([data-ready="true"]) { opacity: 0; visibility: hidden; }
    #app[data-ready="true"] { opacity: 1; visibility: visible; transition: opacity 0.16s ease-out; }
  </style>
</head>
<body class="bg-white text-brand-slate">

  <div id="app">
    <!-- Header Halaman -->
    <div>
      <h1 class="text-xl font-extrabold tracking-tight text-brand-slate sm:text-2xl">Manajemen Data Warga</h1>
      <p class="text-xs font-medium text-brand-muted">Data kependudukan, kontak darurat, dan status akun lingkungan RT 05 / RW 03.</p>
    </div>

    <!-- Pencarian & Filter Peran -->
    <section class="flex flex-col gap-3 sm:flex-row">
      <div class="relative w-full sm:w-80 md:w-96">
        <input id="search-warga" type="text" placeholder="Cari nama, NIK, email, alamat…"
          class="w-full rounded-full border border-slate-200/80 bg-white px-5 py-2.5 text-xs font-semibold text-slate-800 shadow-sm transition-all placeholder:font-medium placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500/50">
        <i data-lucide="search" class="pointer-events-none absolute right-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" stroke-width="2.5"></i>
      </div>

      <select id="filter-role"
        class="rounded-full border border-slate-200/80 bg-white px-4 py-2.5 text-xs font-bold text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500/50">
        <option value="all">Semua Peran</option>
        <option value="warga">Warga</option>
        <option value="rt">Pengurus RT</option>
        <option value="admin">Admin</option>
      </select>
    </section>

    <!-- Tabel Data Warga -->
    <div class="overflow-hidden rounded-3xl border border-slate-100/90 bg-white shadow-sm">
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full min-w-[720px] text-left">
          <thead>
            <tr class="border-b border-slate-100 bg-slate-50/50 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
              <th class="px-5 py-3">Nama</th>
              <th class="px-4 py-3">NIK / KK</th>
              <th class="px-4 py-3">Kontak</th>
              <th class="px-4 py-3">Domisili</th>
              <th class="px-4 py-3">Peran</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="warga-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/js/db.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    const user = window.Layout.init({ officerOnly: true });
    if (user) {
      let currentQ = '';
      let currentRole = 'all';

      const roleLabels = { warga: 'Warga', rt: 'Pengurus RT', admin: 'Admin' };

      function render() {
        const list = window.RT.listUsers({ q: currentQ, role: currentRole });
        const tbody = document.getElementById('warga-tbody');

        if (list.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="7" class="py-12 text-center text-xs font-semibold text-brand-muted">' +
              'Tidak ada data warga ditemukan.' +
            '</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(function (u) {
          const initial = (u.nama_lengkap || 'W')[0].toUpperCase();
          const isSelf = u.id_users === user.id_users;
          return (
            '<tr class="border-b border-slate-50 text-xs font-semibold text-slate-800 transition-colors hover:bg-slate-50/60">' +
              '<td class="px-5 py-3.5">' +
                '<div class="flex items-center gap-3">' +
                  '<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-2xl bg-sky-50 text-[11px] font-extrabold text-sky-600">' +
                    window.UI.esc(initial) +
                  '</span>' +
                  '<div>' +
                    '<p class="font-bold text-slate-900">' + window.UI.esc(u.nama_lengkap) + '</p>' +
                    '<p class="text-[10px] font-medium text-slate-400">' + window.UI.esc(u.email) + ' · ' + u.jumlah_laporan + ' aduan</p>' +
                  '</div>' +
                '</div>' +
              '</td>' +
              '<td class="px-4 py-3.5 text-[11px] text-slate-500">' +
                '<p class="font-bold text-slate-700">' + window.UI.esc(u.nik) + '</p>' +
                (u.no_kk ? '<p class="text-slate-400">KK: ' + window.UI.esc(u.no_kk) + '</p>' : '') +
              '</td>' +
              '<td class="px-4 py-3.5 text-[11px] text-slate-500">' + window.UI.esc(u.no_telepon) + '</td>' +
              '<td class="max-w-[180px] px-4 py-3.5">' +
                '<p class="truncate text-[11px] text-slate-500">' + window.UI.esc(u.alamat) + '</p>' +
                (u.status_domisili ? '<span class="rounded-full bg-emerald-50 border border-emerald-100/80 px-2 py-0.5 text-[9px] font-bold text-emerald-700">' + window.UI.esc(u.status_domisili) + '</span>' : '') +
              '</td>' +
              '<td class="px-4 py-3.5">' +
                '<span class="rounded-full px-2.5 py-1 text-[10px] font-bold ' + (u.role === 'warga' ? 'bg-slate-100 text-slate-700' : 'bg-sky-50 text-sky-700 border border-sky-100') + '">' +
                  window.UI.esc(roleLabels[u.role] || u.role) +
                '</span>' +
              '</td>' +
              '<td class="px-4 py-3.5">' +
                '<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[10px] font-bold ' + (u.status === 'aktif' ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-slate-100 text-slate-400') + '">' +
                  '<span class="h-1.5 w-1.5 rounded-full ' + (u.status === 'aktif' ? 'bg-emerald-500' : 'bg-slate-300') + '"></span>' +
                  u.status +
                '</span>' +
              '</td>' +
              '<td class="px-4 py-3.5 text-right">' +
                '<span class="inline-flex gap-1">' +
                  '<button data-edit="' + u.id_users + '" aria-label="Ubah" class="rounded-xl p-1.5 text-slate-400 transition-colors hover:text-slate-900 hover:bg-slate-100">' +
                    '<i data-lucide="pencil" class="h-3.5 w-3.5"></i>' +
                  '</button>' +
                  '<button data-delete="' + u.id_users + '" aria-label="Hapus" ' + (isSelf ? 'disabled' : '') + ' class="rounded-xl p-1.5 text-slate-400 transition-colors hover:text-rose-600 hover:bg-rose-50 disabled:opacity-30 disabled:hover:text-slate-300">' +
                    '<i data-lucide="trash-2" class="h-3.5 w-3.5"></i>' +
                  '</button>' +
                '</span>' +
              '</td>' +
            '</tr>'
          );
        }).join('');

        tbody.querySelectorAll('[data-edit]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openEditModal(btn.getAttribute('data-edit'));
          });
        });
        tbody.querySelectorAll('[data-delete]:not([disabled])').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-delete');
            const target = window.RT.findUser(Number(id));
            if (confirm('Hapus permanen data warga "' + (target ? target.nama_lengkap : '') + '"? Semua aduan miliknya akan ikut terhapus.')) {
              try {
                window.RT.deleteUser(id);
                window.UI.toast('Data warga berhasil dihapus', 'info');
                render();
              } catch (err) {
                window.UI.toast(err.message, 'error');
              }
            }
          });
        });

        window.UI.icons();
      }

      function openEditModal(id) {
        const u = window.RT.findUser(Number(id));
        if (!u) return;

        const isSelf = u.id_users === user.id_users;

        const bodyHTML =
          '<form id="form-edit-warga" class="space-y-3.5">' +
            '<div>' +
              '<label class="' + window.UI.LABEL_CLS + '">Nama Lengkap</label>' +
              '<input name="nama_lengkap" required value="' + window.UI.esc(u.nama_lengkap) + '" class="' + window.UI.INPUT_CLS + '">' +
            '</div>' +
            '<div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2">' +
              '<div>' +
                '<label class="' + window.UI.LABEL_CLS + '">No. HP / WhatsApp</label>' +
                '<input name="no_telepon" required value="' + window.UI.esc(u.no_telepon) + '" class="' + window.UI.INPUT_CLS + '">' +
              '</div>' +
              '<div>' +
                '<label class="' + window.UI.LABEL_CLS + '">No. Kartu Keluarga</label>' +
                '<input name="no_kk" value="' + window.UI.esc(u.no_kk || '') + '" class="' + window.UI.INPUT_CLS + '">' +
              '</div>' +
            '</div>' +
            '<div>' +
              '<label class="' + window.UI.LABEL_CLS + '">Alamat Rumah</label>' +
              '<textarea name="alamat" required rows="2" class="' + window.UI.INPUT_CLS + '">' + window.UI.esc(u.alamat) + '</textarea>' +
            '</div>' +
            '<div class="grid grid-cols-1 gap-3.5 sm:grid-cols-3">' +
              '<div>' +
                '<label class="' + window.UI.LABEL_CLS + '">Domisili</label>' +
                '<select name="status_domisili" class="' + window.UI.INPUT_CLS + '">' +
                  '<option value="">—</option>' +
                  ['Pemilik', 'Kontrak', 'Ikut Keluarga'].map(function (s) {
                    return '<option value="' + s + '" ' + (u.status_domisili === s ? 'selected' : '') + '>' + s + '</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
              '<div>' +
                '<label class="' + window.UI.LABEL_CLS + '">Jml Anggota</label>' +
                '<input name="jumlah_anggota" type="number" min="1" value="' + (u.jumlah_anggota || 1) + '" class="' + window.UI.INPUT_CLS + '">' +
              '</div>' +
              '<div>' +
                '<label class="' + window.UI.LABEL_CLS + '">Status Akun</label>' +
                '<select name="status" class="' + window.UI.INPUT_CLS + '">' +
                  '<option value="aktif" ' + (u.status === 'aktif' ? 'selected' : '') + '>Aktif</option>' +
                  '<option value="nonaktif" ' + (u.status === 'nonaktif' ? 'selected' : '') + '>Nonaktif</option>' +
                '</select>' +
              '</div>' +
            '</div>' +
            '<div>' +
              '<label class="' + window.UI.LABEL_CLS + '">Peran (Role)' + (isSelf ? ' <span class="text-slate-400 font-normal">(tidak bisa ganti peran sendiri)</span>' : '') + '</label>' +
              '<select name="role" ' + (isSelf ? 'disabled' : '') + ' class="' + window.UI.INPUT_CLS + '">' +
                '<option value="warga" ' + (u.role === 'warga' ? 'selected' : '') + '>Warga</option>' +
                '<option value="rt" ' + (u.role === 'rt' ? 'selected' : '') + '>Pengurus RT</option>' +
                '<option value="admin" ' + (u.role === 'admin' ? 'selected' : '') + '>Admin</option>' +
              '</select>' +
            '</div>' +
            '<div class="flex gap-2 pt-2">' +
              '<button type="button" data-cancel class="' + window.UI.OUTLINE_BTN + ' flex-1">Batal</button>' +
              '<button type="submit" class="' + window.UI.PRIMARY_BTN + ' flex-1">Simpan Data</button>' +
            '</div>' +
          '</form>';

        const modal = window.UI.openModal('Ubah Data: ' + u.nama_lengkap, bodyHTML, { maxWidth: 'max-w-lg' });
        const formEl = modal.querySelector('#form-edit-warga');
        modal.querySelector('[data-cancel]').addEventListener('click', window.UI.closeModal);

        formEl.addEventListener('submit', function (e) {
          e.preventDefault();
          const fd = new FormData(formEl);
          const patch = Object.fromEntries(fd.entries());
          try {
            window.RT.updateUser(id, patch);
            window.UI.toast('Data warga berhasil diperbarui', 'success');
            window.UI.closeModal();
            render();
          } catch (err) {
            window.UI.toast(err.message, 'error');
          }
        });

        window.UI.icons();
      }

      // Event filter
      document.getElementById('filter-role').addEventListener('change', function (e) {
        currentRole = e.target.value;
        render();
      });

      let searchTimer;
      document.getElementById('search-warga').addEventListener('input', function (e) {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          currentQ = e.target.value.trim();
          render();
        }, 250);
      });

      render();
    }
  </script>
</body>
</html>
